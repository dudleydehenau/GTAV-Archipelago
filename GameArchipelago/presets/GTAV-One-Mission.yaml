    'off': 0
    every_10: 0
    every_20: 0
    every_50: 50
    only_100: 0

  police_escapes:
    # Adds five checks for losing the police: escape a 1-star, 2-star... 5-star wanted level (the stars must flash
    # and go away by themselves, being busted or wasted does not count).
    'false': 0
    'true': 50

  activities:
